name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_CACHE_DIR: /tmp/.uv-cache
  UV_FROZEN: "true"
  CFT_VERSION: chrome-130.0.6723.69
  CFT_LABEL: Stable-1
  PLAYWRIGHT_CHANNEL: cft
  PLAYWRIGHT_TRANSPORT: cdp

jobs:
  checks:
    name: Full lint, type, and Python/browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev fontconfig fonts-dejavu-core unzip

      - name: Install dependencies
        run: uv sync --frozen --dev --python "$PYTHON_VERSION"

      - name: Install Playwright browsers required by the suite
        run: uv run --frozen --python "$PYTHON_VERSION" playwright install --with-deps chromium chrome

      - name: Install and verify exact Chrome for Testing archive
        run: |
          cft_build="${CFT_VERSION#chrome-}"
          cft_archive="$RUNNER_TEMP/chrome-for-testing-$cft_build-linux64.zip"
          cft_dir="$HOME/.cache/mdwb/cft/$cft_build"
          curl --fail --location --retry 3 \
            --user-agent "mdwb (+https://github.com/Dicklesworthstone/markdown_web_browser)" \
            "https://storage.googleapis.com/chrome-for-testing-public/$cft_build/linux64/chrome-linux64.zip" \
            --output "$cft_archive"
          printf '%s  %s\n' \
            'f789d53911a50cfa4a2bc1f09cde57567247f52515436d92b1aa9de93c2787d0' \
            "$cft_archive" | sha256sum --check --strict
          mkdir -p "$cft_dir"
          unzip -q "$cft_archive" -d "$cft_dir"
          cft_executable="$cft_dir/chrome-linux64/chrome"
          observed="$("$cft_executable" --version)"
          printf 'Observed CfT executable: %s\n' "$observed"
          [[ "$observed" =~ (^|[[:space:]])130\.0\.6723\.69[[:space:]]*$ ]]
          printf 'CFT_EXECUTABLE=%s\n' "$cft_executable" >> "$GITHUB_ENV"

      - name: Run the same strict gate used locally
        run: bash scripts/run_checks.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strict-check-results
          path: |
            tmp/pytest_report.xml
            tmp/pytest_summary.json
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: markdown-web-browser:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
